name: ENTSO-E watcher (robust v2)

concurrency:
  group: energybot
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "0,30 13-14 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager tzdata pytz
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # Cache-key per dag (UTC) zodat .state blijft bestaan
      - name: Set day key
        run: echo "DAY_KEY=$(date -u +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Restore sent-state cache
        uses: actions/cache@v4
        with:
          path: .state
          key: energybot-state-${{ env.DAY_KEY }}

      - name: Debug paths
        run: |
          pwd
          ls -la
          echo "DAY_KEY=$DAY_KEY"
          ls -la .state || true

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Run bot
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENTS: ${{ secrets.WHATSAPP_RECIPIENTS }}
          GITHUB_ACTIONS: "true"
        run: |
          python run_daily.py

      # Optioneel: deze step kun je weglaten; cache wordt door actions/cache
      # automatisch opgeslagen aan het einde van de job als er changes zijn.
      - name: Save sent-state cache
        uses: actions/cache@v4
        with:
          path: .state
          key: energybot-state-${{ env.DAY_KEY }}
